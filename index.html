              'Pink lips': ['#cc5878', .38],
              'Black eyebrows and eyelashes': ['#100d12', .6],
              'Black eyelashes': ['#100d12', .6],
              'Eye whites': ['#f2eef0', .24],
              'Brown irises': ['#92431b', .28],
              'Pupils': ['#060406', .2],
            };
            const paint = palette[node.material.name];
            if (paint) {
              const name = node.material.name;
              const map = name === 'Pink lips' ? null : node.material.map;
              const material = new THREE.MeshPhongMaterial({ name,
                map, color: map ? '#ffffff' : paint[0], shininess: name === 'Pink lips' ? 52 : 24,
                specular: name === 'Pink lips' ? '#f2bcc8' : '#353535' });
              node.material = material;
              portraitFinish(node, bindInverse.clone().multiply(node.matrixWorld));
            } else {
              const material = node.material;
              node.material = new THREE.MeshPhongMaterial({ name: material.name,
                map: material.map, color: material.color, shininess: 24, specular: '#353535' });
            }
          });
          face.updateMatrixWorld(true);
          krishnaBounds = new THREE.Box3().setFromObject(face, true);
          for (const x of [krishnaBounds.min.x, krishnaBounds.max.x])
            for (const y of [krishnaBounds.min.y, krishnaBounds.max.y])
              for (const z of [krishnaBounds.min.z, krishnaBounds.max.z]) krishnaCorners.push(new THREE.Vector3(x, y, z));
          fitKrishna();
          headRig = headMotion(face);
        }
        eyeLeft = face.getObjectByName('grp_eyeLeft');
        eyeRight = face.getObjectByName('grp_eyeRight');
        eyeBase = [[eyeLeft.rotation.clone(), eyeLeft.position.clone()], [eyeRight.rotation.clone(), eyeRight.position.clone()]];
        scene.add(face);
        if (legacy) (await import('./appearance.js')).styleFace(face);
        let faceMesh = legacy ? face.getObjectByName('mesh_2') : null;
        face.traverse(node => {
          if (node.morphTargetDictionary?.jawOpen !== undefined &&
              (!faceMesh || node.morphTargetInfluences.length > faceMesh.morphTargetInfluences.length)) faceMesh = node;
        });
        mouthShapes = !legacy && face.userData.morphNames
          ? Object.fromEntries(face.userData.morphNames.map((name, index) => [name, index])) : faceMesh.morphTargetDictionary;
        influences = !legacy && face.userData.morphNames ? new Array(face.userData.morphNames.length).fill(0) : faceMesh.morphTargetInfluences;
        if (!legacy) face.traverse(node => {
          if (!node.morphTargetInfluences) return;
          const names = Object.keys(node.morphTargetDictionary);
          if (names.length === influences.length && names.every(name => node.morphTargetDictionary[name] === mouthShapes[name])) {
            node.morphTargetInfluences = influences;
          } else {
            morphBindings.push({ weights: node.morphTargetInfluences,
              indices: names.map(name => [node.morphTargetDictionary[name], mouthShapes[name]]) });
          }
        });
        emotionTarget = new Float32Array(influences.length);
        speechTarget = new Float32Array(influences.length);
        eyeTarget = new Float32Array(influences.length);
        microTarget = new Float32Array(influences.length);
        speechShapeIndices = new Set(Object.entries(mouthShapes).filter(([name]) => /^(mouth|jaw|tongue)/.test(name)).map(([, index]) => index));
        // Meshopt quantization can leave microscopic thickness in eye surfaces
        // that are authored to collapse fully at blink=1. Seal that one axis
        // after decoding so the lightweight model closes exactly like source.
        face.traverse(node => {
          if (!node.isMesh || !node.material.userData.anatomicalEye) return;
          const position = node.geometry.attributes.position;
          for (const name of ['eyeBlink_L', 'eyeBlink_R']) {
            const morph = node.geometry.morphAttributes.position?.[node.morphTargetDictionary[name]];
            if (!morph) continue;
            const ranges = [0, 1, 2].map(axis => {
              let low = Infinity, high = -Infinity;
              for (let i = 0; i < position.count; i++) {
                const value = [position.getX(i), position.getY(i), position.getZ(i)][axis]
                  + [morph.getX(i), morph.getY(i), morph.getZ(i)][axis];
                low = Math.min(low, value); high = Math.max(high, value);
              }
              return { axis, low, high };
            });
            const { axis, low, high } = ranges.sort((a, b) => a.high - a.low - (b.high - b.low))[0];
            const midpoint = (low + high) / 2;
            const center = !morph.normalized && morph.array.BYTES_PER_ELEMENT <= 2 ? Math.round(midpoint) : midpoint;
            const set = axis === 0 ? 'setX' : axis === 1 ? 'setY' : 'setZ';
            const get = axis === 0 ? 'getX' : axis === 1 ? 'getY' : 'getZ';
            for (let i = 0; i < position.count; i++) morph[set](i, center - position[get](i));
          }
          const blinks = ['eyeBlink_L', 'eyeBlink_R']
            .map(name => node.geometry.morphAttributes.position?.[node.morphTargetDictionary[name]]).filter(Boolean);
          if (blinks.length === 2) {
            const ranges = [0, 1, 2].map(axis => {
              const get = axis === 0 ? 'getX' : axis === 1 ? 'getY' : 'getZ';
              let low = Infinity, high = -Infinity;
              for (let i = 0; i < position.count; i++) {
                const value = position[get](i) + blinks[0][get](i) + blinks[1][get](i);
                low = Math.min(low, value); high = Math.max(high, value);
              }
              return { axis, get, low, high };
            });
            const { axis, get, low, high } = ranges.sort((a, b) => a.high - a.low - (b.high - b.low))[0];
            const set = axis === 0 ? 'setX' : axis === 1 ? 'setY' : 'setZ';
            const midpoint = (low + high) / 2;
            const center = !blinks[0].normalized && blinks[0].array.BYTES_PER_ELEMENT <= 2 ? Math.round(midpoint) : midpoint;
            for (let i = 0; i < position.count; i++)
              blinks[0][set](i, center - position[get](i) - blinks[1][get](i));
          }
        });
        const selectEmotion = name => {
          emotionTarget.fill(0);
          for (const [shape, value] of Object.entries(emotions[name] || emotions.Neutral)) {
            const index = mouthShapes[shape];
            if (index !== undefined) emotionTarget[index] = value;
          }
          document.querySelectorAll('#emotions button').forEach(button => button.setAttribute('aria-pressed', button.textContent === name));
        };
        applyEmotion = selectEmotion;
        document.querySelectorAll('#emotions button').forEach(button => { if (emotions[button.textContent]) button.addEventListener('click', () => selectEmotion(button.textContent)); });
        // The first expression should feel available and attentive, not blank
        // or overly cheerful. Subsequent interaction controls the expression.
        selectEmotion('Warm');
        influences.forEach((_, index) => { influences[index] = emotionTarget[index]; });
        if (!legacy) {
          for (const side of ['L', 'R']) influences[mouthShapes[`eyeSquint_${side}`]] = .1;
          influences[mouthShapes.eyeWide_L] = .4;
        }
        lastInteractionAt = performance.now();
        nextIdleEmotionAt = lastInteractionAt + 8000;
        nextBlinkAt = lastInteractionAt + 3000;
        const depth = document.querySelector('#depth input');
        const setDepth = value => face.position.z = value / 100 * 2.8 - 1.4;
        setDepth(30);
        depth.addEventListener('input', event => setDepth(Number(event.target.value)));
        depth.value = 50;
        setDepth(50);
        firstFrame = true;
      };
    if (legacy) loader.load(assetUrl('./facecap.glb'), onModelReady, undefined, onModelError);
    else {
      const fallback = () => loader.load(assetUrl('./krishna-fast.glb'), onModelReady, undefined, onModelError);
      fetch(assetUrl('./krishna-fast.glb.gz')).then(async response => {
        if (!response.ok) throw new Error(`Compressed model returned ${response.status}`);
        let bytes = await response.arrayBuffer();
        const header = new Uint8Array(bytes);
        if (header[0] === 0x1f && header[1] === 0x8b) {
          if (!globalThis.DecompressionStream) throw new Error('Gzip decoding unavailable');
          bytes = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
        }
        if (new DataView(bytes).getUint32(0, true) !== 0x46546c67) throw new Error('Invalid GLB header');
        loader.parse(bytes, assetUrl('./'), onModelReady, fallback);
      }).catch(fallback);
    }

    renderer.setAnimationLoop(time => {
      if (!face) return;
      if (firstFrame && window.instantAvatar?.speaking) {
        // Compile and draw behind the animated cover, then hand off after speech.
        if (!stagedFrame) { renderer.render(scene, camera); stagedFrame = true; }
        return;
      }
      const dt = Math.min(.1, Math.max(.001, (time - previousFrameAt) / 1000)); previousFrameAt = time;
      const moving = time >= motionStartsAt;
      if (influences && moving) syncMouthToAudio();
      const speaking = audioSpeaking || textMouthActive || (!audio.paused && !audio.ended && !!audio.currentSrc) || (externalMouthLevel !== null && !!speechText);
      if (influences && moving) {
        if (speaking) lastInteractionAt = time;
        if (!speaking && time - lastInteractionAt > 7000 && time >= nextIdleEmotionAt) {
          applyEmotion?.(['Warm', 'Neutral', 'Listening'][Math.floor(Math.random() * 3)]);
          idleEmotionActive = true;
          nextIdleEmotionAt = time + 3000 + Math.random() * 4000;
        } else if (idleEmotionActive && (speaking || time - lastInteractionAt <= 7000)) {
          applyEmotion?.('Neutral');
          idleEmotionActive = false;
        }
        if (microTarget) microTarget.forEach((value, index) => { microTarget[index] = value * .92; });
        eyeTarget.fill(0);
        const setEye = (shape, value) => eyeTarget[mouthShapes[shape]] = value;
        // A reader's gaze moves across a line, then steps down to the next.
        // The book sits to the avatar's right, so the reading target is right
        // and slightly down instead of staring fixedly at the camera.
        const readingElapsed = Math.max(0, time - readingStartedAt);
        const readingLine = Math.floor(readingElapsed / 1750) % 3;
        const readingSweep = ((readingElapsed % 1750) / 1750 - .5) * .15;
        const gazeX = readingMode ? .18 + readingSweep : cursor.x * .28;
        const gazeY = readingMode ? .12 + readingLine * .055 : cursor.y * .2;
        if (time >= nextBlinkAt) {
          blinkStartedAt = time;
          blinkEndsAt = time + 240;
          blinkClosedFrame = false;
          nextBlinkAt = time + 2600 + Math.random() * 3600;
        }
        const blinkAge = time - blinkStartedAt;
        let blink = time < blinkEndsAt ? Math.min(1, blinkAge / 60, (240 - blinkAge) / 100) : 0;
        // Even a slow device must render the closed phase, not skip over it.
        if (!blinkClosedFrame && blinkAge >= 60) { blink = 1; blinkClosedFrame = true; }
        if (gazeX > 0) { setEye('eyeLookOut_L', gazeX); setEye('eyeLookIn_R', gazeX); }
        else { setEye('eyeLookIn_L', -gazeX); setEye('eyeLookOut_R', -gazeX); }
        if (gazeY > 0) { setEye('eyeLookDown_L', gazeY); setEye('eyeLookDown_R', gazeY); }
        else { setEye('eyeLookUp_L', -gazeY); setEye('eyeLookUp_R', -gazeY); }
        setEye('eyeBlink_L', blink); setEye('eyeBlink_R', blink);
        const behaviorAge = time - behaviorSince;
        if (!speaking && !readingMode && behaviorState === 'listening') {
          const attentive = (Math.sin(behaviorAge * .003) + 1) / 2;
          setEye('browInnerUp', .06 + attentive * .04);
          setEye('eyeSquint_L', .025); setEye('eyeSquint_R', .025);
        } else if (!speaking && !readingMode && behaviorState === 'thinking') {
          setEye('browInnerUp', .11); setEye('browOuterUp_L', .07);
          setEye('eyeLookDown_L', .12); setEye('eyeLookDown_R', .12);
        }
        if (speaking) {
          setEye('browInnerUp', .025 + speechAccent * .17);
          setEye('browOuterUp_L', .02 + speechAccent * .10);
          setEye('browOuterUp_R', .018 + speechAccent * .075);
          setEye('cheekSquint_L', speechLevel * .025);
          setEye('cheekSquint_R', speechLevel * .03);
        }
        const cuePose = activeCue ? expressionPose(activeCue, (time - cueStartedAt) / 1000) : null;
        if (cuePose) { headTiltTarget = cuePose.tilt; headTiltUntil = time + 100; }
        else if (activeCue) { activeCue = null; applyEmotion?.('Neutral'); }
        influences.forEach((value, index) => {
          const isBlink = index === mouthShapes.eyeBlink_L || index === mouthShapes.eyeBlink_R;
          const isMouth = speechShapeIndices.has(index);
          // Expression mouth weights must not fight articulatory closure/rounding.
          let target = emotionTarget[index] * (speaking && isMouth ? .18 : 1) + speechTarget[index] + eyeTarget[index] + (microTarget?.[index] || 0);
          if (!legacy && (index === mouthShapes.eyeSquint_L || index === mouthShapes.eyeSquint_R)) target = Math.max(.1, target);
          if (!legacy && index === mouthShapes.eyeWide_L) target = Math.max(.4, target);
          if (cuePose) for (const [shape, amount] of Object.entries(cuePose.shapes)) {
            if (mouthShapes[shape] === index) target = Math.max(target, amount);
          }
          const blend = 1 - Math.exp(-dt / (isMouth ? .038 : .13));
          if (speaking && index === mouthShapes.jawOpen) target = Math.min(target, .32);
          influences[index] = isBlink ? Math.min(1, target) : THREE.MathUtils.lerp(value, Math.min(1, target), blend);
        });
        for (const side of ['L', 'R']) for (const shape of ['eyeLookUp', 'eyeLookDown', 'eyeLookIn', 'eyeLookOut', 'eyeWide']) {
          influences[mouthShapes[`${shape}_${side}`]] *= 1 - influences[mouthShapes[`eyeBlink_${side}`]];
        }
      }
      if (face) {
        for (const { weights, indices } of morphBindings) {
          for (const [local, shared] of indices) weights[local] = influences[shared] || 0;
        }
        // Stronger cursor tracking keeps the head responsive while damping prevents snapping.
        const readingNod = readingMode ? Math.sin((time - readingStartedAt) * .0014) * .012 : 0;
        const thinking = behaviorState === 'thinking' && !speaking && !readingMode;
        const listening = behaviorState === 'listening' && !speaking && !readingMode;
        const conversationalNod = speaking ? -speechAccent * .035 + Math.sin(time * .0017) * .006 * speechLevel : listening ? Math.sin(time * .002) * .009 : 0;
        const rotation = headRig?.rotation || face.rotation;
        if (moving) {
        rotation.y = THREE.MathUtils.lerp(rotation.y, readingMode ? .11 : thinking ? .08 : cursor.x * .18, .09);
        rotation.x = THREE.MathUtils.lerp(rotation.x, readingMode ? .13 + readingNod : thinking ? .11 : (legacy ? .06 : 0) + cursor.y * .10 + conversationalNod, .09);
        if (thinking) headTiltTarget = -.035;
        if (listening) headTiltTarget = .018;
        if (readingMode) headTiltTarget = -.045;
        if (performance.now() > headTiltUntil) headTiltTarget *= .94;
        rotation.z = THREE.MathUtils.lerp(rotation.z, headTiltTarget, .06);
        }
        headRig?.update();
        if (!legacy && krishnaCorners.length) {
          const bottom = Math.min(...krishnaCorners.map(corner => corner.clone().applyEuler(face.rotation).y));
          face.position.y = camera.bottom - bottom;
        }
        const eyeX = readingMode ? .18 : cursor.x;
        const eyeY = readingMode ? .22 : cursor.y;
        if (moving) for (const [eye, [rotation, position]] of [[eyeLeft, eyeBase[0]], [eyeRight, eyeBase[1]]]) {
          eye.rotation.y = THREE.MathUtils.lerp(eye.rotation.y, rotation.y + eyeX * (legacy ? .22 : .09), .08);
          eye.rotation.x = THREE.MathUtils.lerp(eye.rotation.x, rotation.x + eyeY * (legacy ? .08 : .045), .08);
          if (legacy) eye.position.x = THREE.MathUtils.lerp(eye.position.x, position.x + eyeX * .03, .08);
        }
      }
      controls?.update();
      renderer.render(scene, camera);
      if (firstFrame) {
        firstFrame = false;
        renderer.domElement.style.visibility = 'visible';
        const poster = document.querySelector('#poster');
        poster.style.opacity = '0';
        motionStartsAt = time + 300;
        if (devicePixelRatio > 1) setTimeout(() => renderer.setPixelRatio(Math.min(1.5, devicePixelRatio)), 200);
        setTimeout(() => {
          poster.hidden = true;
          window.parent.postMessage({ type: 'face-ready' }, '*');
        }, 300);
        performance.mark('krishna-ready');
      }
    });
    addEventListener('resize', () => { if (legacy) { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); } else fitKrishna(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
